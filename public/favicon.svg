<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="256" height="256" fill="#3d4a5c"/>
  
  <!-- Box/Cube Icon - White -->
  <g transform="translate(48, 48)">
    <!-- Top face of cube -->
    <path d="M 40 30 L 80 10 L 120 30 L 80 50 Z" 
          fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left face of cube -->
    <path d="M 40 30 L 40 90 L 80 110 L 80 50 Z" 
          fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right face of cube -->
    <path d="M 80 50 L 80 110 L 120 90 L 120 30 Z" 
          fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
